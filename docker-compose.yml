services:
  radius-proxy:
    build: ./radius-proxy
    image: ghcr.io/essinghigh-org/radius-proxy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-54567}:54567"
    environment:
      NODE_ENV: production
    volumes:
      - ./config.toml:/app/config.toml:ro
      - signing-keys:/app/.keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  signing-keys:
